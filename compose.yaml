# Environnement de développement : docker compose up -d
# Application : http://localhost:8080 — Mails de test : http://localhost:8025
services:
  app:
    build: ./docker/php
    ports: ["8080:80"]
    volumes:
      - .:/var/www/html
      # Dépendances et cache restent dans des volumes Docker : sur Windows,
      # les lire à travers le montage du dossier rend chaque page très lente.
      - app_vendor:/var/www/html/vendor
      - app_var:/var/www/html/var
    depends_on: [db, mongo, mailpit]

  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: outsee
      MARIADB_USER: outsee
      MARIADB_PASSWORD: outsee
      MARIADB_ROOT_PASSWORD: root
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports: ["3308:3306"]
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/db:/docker-entrypoint-initdb.d:ro

  mongo:
    image: mongo:7
    ports: ["27018:27017"]
    volumes: ["mongo_data:/data/db"]

  mailpit:
    image: axllent/mailpit
    ports: ["8025:8025"]

volumes:
  app_vendor:
  app_var:
  db_data:
  mongo_data:
