name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  qualite:
    name: Style et analyse statique
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, pdo_mysql, mongodb-2.5.6
          tools: composer:v2

      - name: Dépendances
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Style du code (PHP CS Fixer)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Analyse statique (PHPStan)
        run: |
          php bin/console cache:warmup --env=dev
          vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Gabarits Twig et conteneur
        run: |
          php bin/console lint:twig templates
          php bin/console lint:container

  tests:
    name: Tests (MariaDB + MongoDB)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=10
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/outsee?serverVersion=11.4.0-MariaDB&charset=utf8mb4
      MONGODB_URI: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, pdo_mysql, mongodb-2.5.6
          ini-values: date.timezone=Europe/Paris
          tools: composer:v2

      - name: Dépendances
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Migrations sur une base vide
        run: |
          php bin/console doctrine:database:create --env=test --if-not-exists
          php bin/console doctrine:migrations:migrate --env=test --no-interaction
          php bin/console doctrine:schema:validate --env=test

      - name: PHPUnit
        run: php bin/phpunit
