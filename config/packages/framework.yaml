framework:
    secret: '%env(APP_SECRET)%'

    # Sessions rangées avec l'application : elles survivent à un redémarrage
    # du serveur, et le cookie n'est jamais lisible par JavaScript.
    session:
        handler_id: null
        save_path: '%kernel.project_dir%/var/sessions/%kernel.environment%'
        cookie_secure: auto
        cookie_samesite: lax
        cookie_httponly: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
