security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        utilisateurs:
            entity:
                class: App\Entity\Utilisateur
                property: email

    role_hierarchy:
        ROLE_ADMIN: [ROLE_PARTENAIRE]

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: utilisateurs
            user_checker: App\Security\VerificateurCompte
            form_login:
                login_path: connexion
                check_path: connexion
                username_parameter: email
                password_parameter: mot_de_passe
                enable_csrf: true
                default_target_path: accueil
            # Cinq essais par quart d'heure, par adresse et par IP : de quoi se
            # tromper sans ouvrir la porte à une attaque par force brute.
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 2592000
                signature_properties: ['password']
            logout:
                path: deconnexion
                target: accueil

    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/partenaire, roles: ROLE_PARTENAIRE }
        - { path: ^/(pass|moi|squads/nouvelle), roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
